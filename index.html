<html lang="fa" dir="rtl" data-theme="dark">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="کارنامه Pro؛ ابزار مدیریت و تحلیل کارنامه و آزمون‌ها">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>کارنامه Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --font:Vazirmatn,system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:28px;--s7:40px;--s8:64px;
}
[data-theme="dark"]{
  --bg:oklch(14% .022 265);
  --surface:oklch(18% .024 265);
  --surface-hi:oklch(22% .028 265);
  --sunk:oklch(12% .02 265);
  --ink:oklch(96% .01 265);
  --ink2:oklch(76% .02 265);
  --ink3:oklch(54% .025 265);
  --line:oklch(25% .025 265);
  --line2:oklch(32% .03 265);
  --acc:oklch(68% .22 265);
  --acc-glow:oklch(68% .22 265 / .25);
  --acc-soft:oklch(24% .06 265);
  --ok:oklch(72% .18 155);
  --ok-soft:oklch(22% .06 155);
  --ok-line:oklch(35% .09 155);
  --bad:oklch(66% .22 25);
  --bad-soft:oklch(22% .07 25);
  --bad-line:oklch(35% .09 25);
  --mute:oklch(28% .02 265);
  --gold:oklch(78% .16 75);
  --gold-soft:oklch(24% .06 75);
  --card-shadow:0 8px 32px -4px oklch(5% .02 265 / .6);
}
[data-theme="light"]{
  --bg:oklch(96.5% .012 265);
  --surface:oklch(99.5% .005 265);
  --surface-hi:oklch(100% 0 0);
  --sunk:oklch(93.5% .015 265);
  --ink:oklch(20% .04 265);
  --ink2:oklch(42% .03 265);
  --ink3:oklch(58% .025 265);
  --line:oklch(89% .015 265);
  --line2:oklch(82% .02 265);
  --acc:oklch(52% .22 265);
  --acc-glow:oklch(52% .22 265 / .2);
  --acc-soft:oklch(93% .05 265);
  --ok:oklch(56% .16 155);
  --ok-soft:oklch(94% .06 155);
  --ok-line:oklch(82% .09 155);
  --bad:oklch(58% .21 25);
  --bad-soft:oklch(94% .05 25);
  --bad-line:oklch(82% .09 25);
  --mute:oklch(86% .015 265);
  --gold:oklch(68% .16 75);
  --gold-soft:oklch(94% .06 75);
  --card-shadow:0 12px 36px -6px oklch(30% .04 265 / .08);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  position:relative;
  transition:background-color .3s var(--ease),color .3s var(--ease);
}

/* ambient tech backdrop */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(ellipse 80% 50% at 50% -20%,var(--acc-glow),transparent 70%);
  pointer-events:none;
  z-index:0;
}

h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(1.8rem,3.4vw,2.6rem);font-weight:900;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* header */
.top{
  position:sticky;
  top:0;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--s4);
  padding:var(--s3) var(--s6);
  background:color-mix(in oklch,var(--bg) 85%,transparent);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.15rem;letter-spacing:-.01em}
.mark{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  border-radius:10px;
  background:linear-gradient(135deg,var(--acc),oklch(50% .2 310));
  color:#fff;
  font-weight:900;
  box-shadow:0 0 20px var(--acc-glow);
}
#nav{display:flex;gap:var(--s1);background:var(--surface);padding:4px;border-radius:999px;border:1px solid var(--line)}
#nav button{
  border:0;
  background:none;
  padding:7px 18px;
  border-radius:999px;
  color:var(--ink2);
  font-weight:600;
  font-size:.9rem;
  transition:all .2s var(--ease);
}
#nav button:hover{color:var(--ink)}
#nav button.on{
  background:var(--acc);
  color:#fff;
  box-shadow:0 4px 16px var(--acc-glow);
}
.actions-top{display:flex;align-items:center;gap:var(--s2)}
.theme-btn,.lang-sel{
  height:38px;
  border-radius:10px;
  border:1px solid var(--line2);
  background:var(--surface);
  color:var(--ink);
  font-weight:600;
  padding:0 12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:all .15s var(--ease);
}
.theme-btn{width:38px;padding:0;font-size:1.1rem}
.theme-btn:hover,.lang-sel:hover{background:var(--surface-hi);border-color:var(--acc)}

main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:var(--s6) var(--s5) var(--s8)}
main>*{animation:reveal .4s var(--ease) both}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* fields */
.field label{display:block;font-size:.8rem;color:var(--ink2);margin-bottom:6px;font-weight:600}
input,select,textarea{
  font:inherit;
  color:inherit;
  background:var(--surface);
  border:1px solid var(--line2);
  border-radius:12px;
  padding:10px 14px;
  min-height:46px;
  width:100%;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea{min-height:110px;resize:vertical;line-height:1.7}
.total-field input{
  font-size:1.6rem;
  font-weight:900;
  text-align:center;
  border-color:var(--acc);
  background:var(--acc-soft);
  color:var(--ink);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:44px;
  padding:0 20px;
  border-radius:12px;
  border:1px solid var(--line2);
  background:var(--surface);
  font-weight:700;
  font-size:.92rem;
  transition:all .15s var(--ease);
  white-space:nowrap;
}
.btn:hover{background:var(--surface-hi);border-color:var(--line)}
.btn:active{transform:scale(.98)}
.btn.primary{
  background:var(--acc);
  border-color:transparent;
  color:#fff;
  box-shadow:0 6px 20px var(--acc-glow);
}
.btn.primary:hover{opacity:.92;transform:translateY(-1px)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface);color:var(--ink)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.85rem;border-radius:9px}
.btn.danger{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.btn.danger:hover,.btn.armed{background:var(--bad);color:#fff;border-color:transparent}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:800}
.hint{color:var(--ink3);font-size:.86rem}
.warn{color:var(--bad);font-size:.86rem;font-weight:600}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}

/* cards & dashboard */
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s6)}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s4);margin-bottom:var(--s6)}
.sc{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:var(--s5);
  box-shadow:var(--card-shadow);
  display:grid;
  gap:4px;
  position:relative;
  overflow:hidden;
}
.sc::before{
  content:"";
  position:absolute;
  inset-inline-start:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--acc);
}
.sc dt{font-size:.8rem;color:var(--ink3);font-weight:600}
.sc dd{margin:0;font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.sc .delta{font-size:.85rem;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}

.chart-panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:var(--s5) var(--s5) var(--s3);
  box-shadow:var(--card-shadow);
  margin-bottom:var(--s7);
}
.chart-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s3);flex-wrap:wrap;gap:var(--s3)}
.chart-wrap{height:340px;position:relative}
#exam-chart-select{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--surface-hi);color:var(--ink);font:inherit;min-width:220px}
.weak li{border-bottom:1px solid var(--line)}.weak li:last-child{border-bottom:0}

.chips{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line)}
.chip{
  border:1px solid var(--line2);
  background:var(--bg);
  border-radius:999px;
  padding:5px 14px;
  font-size:.82rem;
  color:var(--ink2);
  font-weight:600;
  transition:all .15s;
}
.chip:hover{border-color:var(--acc);color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 2px 10px var(--acc-glow)}

.dash-cols{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(280px,1fr);gap:var(--s6);align-items:start}
.exam-list{display:grid;gap:var(--s3)}
.ex{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--card-shadow);
  overflow:hidden;
  transition:border-color .15s;
}
.ex:hover{border-color:var(--line2)}
.ex-head{
  display:grid;
  grid-template-columns:110px minmax(0,1fr) 140px 76px 20px;
  align-items:center;
  gap:var(--s4);
  width:100%;
  padding:16px var(--s5);
  background:none;
  border:0;
  text-align:start;
}
.ex-date{color:var(--ink3);font-size:.85rem;font-weight:600}
.ex-name{font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-name small{color:var(--ink3);font-weight:400;margin-inline-start:8px;font-size:.82rem}
.stack{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--mute)}
.stack span{display:block;height:100%;transition:width .4s var(--ease)}
.stack .c{background:var(--ok)}.stack .w{background:var(--bad)}
.ex-pct{font-weight:900;font-size:1.25rem;text-align:end;font-variant-numeric:tabular-nums;color:var(--acc)}
.ex-pct.neg{color:var(--bad)}
.chev{color:var(--ink3);transition:transform .3s var(--ease);font-size:.8rem;text-align:center}
.ex.open .chev{transform:rotate(180deg)}
.ex-body{
  padding:var(--s2) var(--s5) var(--s5);
  display:grid;
  gap:var(--s4);
  border-top:1px solid var(--line);
  background:var(--sunk);
}
.bd{display:grid;gap:4px}
.bd-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 48px 48px 48px 74px;
  gap:var(--s2);
  padding:8px var(--s3);
  font-size:.9rem;
  font-variant-numeric:tabular-nums;
  border-radius:8px;
  background:var(--surface);
}
.bd-row.cf{grid-template-columns:minmax(0,1fr) 42px 42px 42px 76px 92px}
.bd-row span:not(:first-child){text-align:center}
.bd-row b{text-align:end}
.bd-row.h{color:var(--ink3);font-size:.78rem;font-weight:700;background:none;padding:0 var(--s3)}
.bd-row .c{color:var(--ok);font-weight:700}.bd-row .w{color:var(--bad);font-weight:700}.bd-row .b{color:var(--ink3)}
.strip{display:flex;flex-wrap:wrap;gap:3px}
.strip i{width:11px;height:14px;border-radius:3px;background:var(--mute)}
.strip i.c{background:var(--ok)}.strip i.w{background:var(--bad)}
.strip i.f{outline:2px solid var(--gold);outline-offset:1px}

.weak-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:var(--s5);
  box-shadow:var(--card-shadow);
  display:grid;
  gap:var(--s4);
}
.weak{list-style:none;margin:0;padding:0;display:grid;gap:var(--s4)}
.weak li{display:grid;grid-template-columns:1fr auto;gap:4px 8px}
.weak li b{font-variant-numeric:tabular-nums}
.weak small{font-size:.75rem;margin-inline-start:6px;font-weight:700}
.thin{grid-column:1/-1;height:6px;background:var(--mute);border-radius:99px;overflow:hidden}
.thin span{display:block;height:100%;background:var(--acc);border-radius:99px}
.weak li:first-child .thin span{background:var(--bad)}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s6);align-items:start}
.ed-main{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:var(--s6);
  box-shadow:var(--card-shadow);
  display:grid;
  gap:var(--s6);
}
.basics{display:grid;grid-template-columns:1.5fr 1.2fr 1fr;gap:var(--s4)}
.basics .total-field{grid-column:1}
.basics .name{grid-column:2/-1}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);flex-wrap:wrap}
.seg-toggle{display:inline-flex;background:var(--sunk);border-radius:12px;padding:4px;gap:2px}
.seg-toggle button{
  border:0;
  background:none;
  padding:8px 18px;
  border-radius:9px;
  color:var(--ink2);
  font-weight:600;
  min-height:38px;
  transition:all .15s;
}
.seg-toggle button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px oklch(0% 0 0 / .15)}
.st-row{display:grid;grid-template-columns:minmax(120px,2fr) repeat(5,minmax(52px,1fr)) 36px;gap:var(--s2);align-items:center;margin-bottom:var(--s2)}
.st-head{font-size:.76rem;color:var(--ink3);font-weight:700}
.st-row input{text-align:center}
.st-row input[data-k=name]{text-align:start}
.st-row output{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;background:var(--sunk);color:var(--ink2);font-weight:700}
.rng-row{display:grid;grid-template-columns:minmax(100px,1fr) 70px 70px 64px 36px;gap:var(--s2);align-items:center;margin-bottom:var(--s2)}
.rng-row input{text-align:center}.rng-row input[data-k=name]{text-align:start}
.tools{display:grid;gap:var(--s3);padding:var(--s4);background:var(--sunk);border-radius:14px;border:1px solid var(--line)}
.quick{display:grid;grid-template-columns:auto 80px minmax(0,1fr) auto;gap:var(--s2);align-items:center}
.quick #qtext{direction:ltr;letter-spacing:.25em;font-weight:700}
kbd{background:var(--surface);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;font-size:.85em}
.qgroup{margin-top:var(--s5)}
.qg-head{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:8px}
.q{
  border:1px solid var(--line);
  background:var(--bg);
  border-radius:12px;
  padding:8px;
  display:grid;
  grid-template-columns:1fr auto;
  grid-template-areas:"n f" "seg seg" "r r";
  gap:6px;
  transition:all .12s;
}
.q:focus-visible{outline:2px solid var(--acc);box-shadow:0 0 0 4px var(--acc-glow)}
.qn{grid-area:n;font-weight:800;font-size:.9rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.fl{grid-area:f;border:0;background:none;color:var(--mute);font-size:1rem;line-height:1;cursor:pointer}
.flg .fl{color:var(--gold)}
.flg{border-color:var(--gold);box-shadow:0 0 10px var(--gold-soft)}
.seg{grid-area:seg;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{
  height:32px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:8px;
  font-size:1rem;
  font-weight:800;
  color:var(--ink3);
  padding:0;
  transition:all .12s;
}
.s-c{background:var(--ok-soft);border-color:var(--ok-line)}
.s-c [data-v=c]{background:var(--ok);border-color:transparent;color:#fff}
.s-w{background:var(--bad-soft);border-color:var(--bad-line)}
.s-w [data-v=w]{background:var(--bad);border-color:transparent;color:#fff}
.s-b [data-v=b]{background:var(--mute);color:var(--ink)}
.rsn{grid-area:r;min-height:30px;padding:2px 8px;font-size:.76rem;border-radius:8px}
.q:not(.s-w) .rsn{display:none}

.ed-side{
  position:sticky;
  top:88px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:var(--s5);
  box-shadow:var(--card-shadow);
  display:grid;
  gap:var(--s4);
}
.big{font-size:clamp(3.2rem,6vw,4.5rem);font-weight:900;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--acc)}
.big.neg{color:var(--bad)}
.legend{list-style:none;margin:0;padding:0;display:flex;gap:var(--s4);flex-wrap:wrap;font-size:.9rem;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
i.c{background:var(--ok)}i.w{background:var(--bad)}i.b{background:var(--mute)}

/* error log */
.err-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:var(--s6);
  box-shadow:var(--card-shadow);
}
.err-row{
  display:grid;
  grid-template-columns:28px 76px minmax(100px,1fr) 88px minmax(150px,210px) 24px;
  gap:10px;
  align-items:center;
  margin:12px 0;
  padding:16px;
  border:1px solid rgba(139,92,246,.25);
  border-radius:18px;
  background:linear-gradient(135deg,var(--surface-hi),var(--surface) 58%,rgba(34,211,238,.035));
  box-shadow:0 8px 24px rgba(0,0,0,.12),inset 0 1px rgba(255,255,255,.035);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.err-row:hover{transform:translateY(-2px);border-color:rgba(34,211,238,.55);box-shadow:0 12px 28px rgba(34,211,238,.09)}
.err-row.done{opacity:.65;border-color:rgba(52,211,153,.3)}
.err-row>input[type=checkbox]{accent-color:#a78bfa;width:17px;height:17px}
.err-row>span:nth-child(2){font-weight:800;color:#c4b5fd}
.err-row select{min-width:0;width:100%;border-radius:10px}
.err-row .err-comment{grid-column:1/-1;resize:vertical;min-height:74px;width:100%;margin-top:5px;border-radius:13px;border:1px solid rgba(139,92,246,.22);background:var(--sunk);padding:12px 14px;line-height:1.8;transition:border-color .2s,box-shadow .2s}
.err-row .err-comment:focus{outline:none;border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.10)}

function studyRecommendation(name,stats){
  const kind=subjectKind(name),book=STUDY_PLAYBOOK[kind]||STUDY_PLAYBOOK.general;
  let priority='تمرین هدفمند',tone='';
  if(stats.avg<40){priority='تقویت پایه';tone='alert'}
  else if(stats.d<=-10){priority='افت اخیر';tone='alert'}
  else if(stats.blankRate>=.28){priority='مدیریت زمان';tone='alert'}
  else if(stats.wrongRate>=.28){priority='افزایش دقت';tone='alert'}
  else if(stats.avg>=75){priority='تثبیت و پیشرفت';tone='good'}
  let tip;
  if(stats.reason!=='none'&&book[stats.reason])tip=book[stats.reason];
  else if(stats.avg<40)tip=book.foundation;
  else if(stats.d<=-10)tip=book.decline;
  else if(stats.blankRate>=.28)tip=book.time;
  else if(stats.wrongRate>=.28)tip=book.practice;
  else if(stats.avg>=75)tip=book.maintain;
  else tip=book.practice;
  return{tip,priority,tone};
}

}

/* scoring engine */
function owners(ex){
  const n=int(ex.total);const o=new Array(n).fill(-1);
  (ex.ranges||[]).forEach((r,ri)=>{
    const f=Math.max(1,int(r.from)),to=Math.min(n,int(r.to));
    for(let q=f;q<=to;q++)if(o[q-1]<0)o[q-1]=ri;
  });
  return o;
}
function compute(ex){
  const pen=+ex.penalty||0;let groups=[];
  if(ex.mode==='detail'){
    const n=int(ex.total),o=owners(ex);
    groups=(ex.ranges||[]).map(r=>({name:(r.name||'').trim()||'—',coef:coefValue(r.coef),n:0,c:0,w:0,b:0}));
    const other={name:t('other'),coef:1,n:0,c:0,w:0,b:0};
    for(let i=0;i<n;i++){
      const a=(ex.answers||[])[i]||{s:'b'};
      const g=o[i]>=0?groups[o[i]]:other;
      g.n++;g[a.s]++;
    }
    groups=groups.filter(g=>g.n>0);if(other.n)groups.push(other);
  }else{
    groups=(ex.subjects||[]).map(s=>{
      const n=int(s.count),c=int(s.c),w=int(s.w);
      return{name:(s.name||'').trim()||'—',coef:coefValue(s.coef),n,c,w,b:Math.max(0,n-c-w)};
    }).filter(g=>g.n>0);
  }
  const tot={n:0,c:0,w:0,b:0};
  groups.forEach(g=>{tot.n+=g.n;tot.c+=g.c;tot.w+=g.w;tot.b+=g.b});
  const p=g=>g.n?((g.c-g.w*pen)/g.n)*100:0;
  groups.forEach(g=>{g.pct=p(g);g.pctNoPenalty=g.n?(g.c/g.n)*100:0});
  // Weight each subject's percentage by its coefficient; empty coefficients default to 1.
  const weighted=(noPenalty=false)=>{
    const denom=groups.reduce((sum,g)=>sum+g.coef,0);
    const numer=groups.reduce((sum,g)=>sum+((noPenalty?g.pctNoPenalty:g.pct)*g.coef),0);
    return denom>0?numer/denom:0;
  };
  tot.pct=weighted(false);
  tot.pctNoPenalty=weighted(true);
  tot.groups=groups;
  return tot;
}
function subjectOf(ex,i){const o=owners(ex);return o[i]>=0?((ex.ranges[o[i]].name||'').trim()||'—'):t('other')}

function subjectNames(){
  const set=new Set();
  S.exams.forEach(e=>{const g=compute(e).groups;if(g.length>1)g.forEach(x=>set.add(x.name))});
  return[...set];
}

  }
  const ex=sortedExams(),res=ex.map(e=>compute(e)),ps=res.map(r=>r.pct);
  const avg=ps.reduce((a,b)=>a+b,0)/ps.length,best=Math.max(...ps),last=ps[ps.length-1],delta=ps.length>1?last-ps[ps.length-2]:null;
  const subs=subjectNames();

  const bySub={};
  ex.forEach((e,i)=>{
    const g=res[i].groups;

  const weak=Object.entries(bySub).map(([k,a])=>{

    ex.slice(-5).forEach(e=>{

function subRow(s,i){
  const n=int(s.count),c=int(s.c),w=int(s.w),bad=c+w>n;
  return`<div class="st-row ${bad?'bad':''}" id="sr-${i}"><input data-sub="${i}" data-k="name" value="${esc(s.name)}" placeholder="${t('subject')}"><input data-sub="${i}" data-k="count" inputmode="numeric" value="${esc(s.count)}"><input data-sub="${i}" data-k="c" inputmode="numeric" value="${esc(s.c)}"><input data-sub="${i}" data-k="w" inputmode="numeric" value="${esc(s.w)}"><output id="sb-${i}">${nf(Math.max(0,n-c-w))}</output><input data-sub="${i}" data-k="coef" inputmode="decimal" aria-label="ضریب" title="ضریب درس" value="${esc(s.coef??1)}" style="min-width:0;padding:8px 4px"><button class="btn sm danger" data-a="rm-sub" data-i="${i}" style="padding:0 8px" ${draft.subjects.length<2?'disabled style="visibility:hidden"':''}>✕</button></div>`;
}
function sumMsg(){
  const d=draft;if(d.subjects.some(s=>int(s.c)+int(s.w)>int(s.count)))return t('overflow');
  const sum=d.subjects.reduce((a,s)=>a+int(s.count),0),n=int(d.total);
  return d.subjects.length>1&&n&&sum!==n?t('sum_mismatch',{a:nf(sum),b:nf(n)}):'';
}
function renderGrid(){
  const d=draft,n=int(d.total);if(!n)return`<p class="hint" style="padding:24px 0">${t('need_total')}</p>`;
  const o=owners(d),runs=[];let cur=null;
  for(let i=0;i<n;i++){if(!cur||cur.ri!==o[i]){cur={ri:o[i],a:i,b:i};runs.push(cur)}else cur.b=i}
  const unc=o.filter(x=>x<0).length;
  const reasonOpts=a=>`<option value="">${t('r_none')}</option>`+REASONS.map(r=>`<option value="${r}" ${a.r===r?'selected':''}>${t('r_'+r)}</option>`).join('');
  return(unc?`<p class="warn" style="margin-top:16px">${t('uncovered',{n:nf(unc)})}</p>`:'')+runs.map(r=>{
    const name=r.ri>=0?((d.ranges[r.ri].name||'').trim()||'—'):t('other');let cells='';
    for(let i=r.a;i<=r.b;i++){
      const a=d.answers[i];
      cells+=`<div class="q s-${a.s}${a.f?' flg':''}" tabindex="0" data-q="${i}"><span class="qn">${nf(i+1)}</span><button class="fl" data-flag="${i}" title="${t('flag')}" tabindex="-1">⚑</button><div class="seg"><button data-v="c" tabindex="-1">✓</button><button data-v="w" tabindex="-1">✕</button><button data-v="b" tabindex="-1">–</button></div><select class="rsn" data-rsn="${i}">${reasonOpts(a)}</select></div>`;
    }
    return`<div class="qgroup"><div class="qg-head"><h3>${esc(name)}</h3><span class="hint">${t('q')} ${t('range',{a:nf(r.a+1),b:nf(r.b+1)})}</span><div class="row" style="margin-inline-start:auto"><button class="btn sm ghost" data-a="fill" data-from="${r.a}" data-to="${r.b}" data-v="c">${t('all_correct')}</button><button class="btn sm ghost" data-a="fill" data-from="${r.a}" data-to="${r.b}" data-v="b">${t('clear')}</button></div></div><div class="qgrid">${cells}</div></div>`;
  }).join('');
}

function renderResult(){
  const d=draft,r=compute(d),n=r.n||1,p=PENS.find(x=>Math.abs(x.v-d.penalty)<.001)||PENS[0];

function updateLive(){const el=$('#result');if(el)el.innerHTML=renderResult()}
function setTotal(v){

  while(d.answers.length<n)d.answers.push({s:'b'});
  if(d.subjects.length===1)d.subjects[0].count=n?String(n):'';
  if(d.ranges.length===1&&int(d.ranges[0].from)<=1&&(!int(d.ranges[0].to)||int(d.ranges[0].to)===old))d.ranges[0].to=n||'';

function paintCell(i){const el=main.querySelector(`.q[data-q="${i}"]`);if(!el)return;const a=draft.answers[i];el.className=`q s-${a.s}${a.f?' flg':''}`}
function setAnswer(i,v){const a=draft.answers[i];if(!a)return;a.s=v;if(v!=='w')delete a.r;paintCell(i);updateLive()}
function switchMode(m){
  const d=draft;if(d.mode===m)return;
  if(m==='detail'&&d.subjects.length>1&&d.ranges.length===1&&!(d.ranges[0].name||'').trim()){
    let at=1;d.ranges=d.subjects.filter(s=>int(s.count)).map(s=>{const r={name:s.name,from:at,to:at+int(s.count)-1,coef:coefValue(s.coef)};at+=int(s.count);return r});

function saveDraft(){
  const d=draft;
  const ex={id:d.id||uid(),createdAt:d.createdAt||Date.now(),date:d.date||today(),mode:d.mode,penalty:+d.penalty,note:d.note||'',rank:toEn(d.rank).trim(),level:toEn(d.level).trim()};
  if(d.mode==='overall'){
    if(d.subjects.some(s=>int(s.c)+int(s.w)>int(s.count)))return toast(t('overflow'));
    ex.subjects=d.subjects.map(s=>({name:(s.name||'').trim()||'—',count:int(s.count),c:int(s.c),w:int(s.w),coef:coefValue(s.coef)})).filter(s=>s.count>0);
    ex.total=ex.subjects.reduce((a,s)=>a+s.count,0);if(!ex.total)return toast(t('need_total'));
  }else{
    const n=Math.min(400,int(d.total));if(!n)return toast(t('need_total'));ex.total=n;
    ex.ranges=d.ranges.map(r=>({name:(r.name||'').trim(),from:int(r.from),to:int(r.to),coef:coefValue(r.coef)})).filter(r=>r.from&&r.to>=r.from);
    ex.answers=d.answers.slice(0,n).map(a=>{const o={s:a.s};if(a.r)o.r=a.r;if(a.comment)o.comment=a.comment;if(a.f)o.f=1;if(a.d)o.d=1;return o});

function applyTpl(id){

  const cnt={all:items.length,wrong:items.filter(x=>x.a.s==='w').length,flag:items.filter(x=>x.a.f).length,open:items.filter(x=>!x.a.d).length};
  const f={all:()=>true,wrong:x=>x.a.s==='w',flag:x=>x.a.f,open:x=>!x.a.d}[errFilter];
  const shown=items.filter(f);
  const wr=items.filter(x=>x.a.s==='w'),dist=[...REASONS,''].map(r=>({r,n:wr.filter(x=>(x.a.r||'')===r).length})).filter(x=>x.n),mx=Math.max(1,...dist.map(x=>x.n));

      <div class="chips">${['all','wrong','flag','open'].map(k=>`<button class="chip ${errFilter===k?'on':''}" data-ef="${k}">${t('f_'+k)} (${nf(cnt[k])})</button>`).join('')}</div>
    </div>
    ${dist.length?`<section style="margin-bottom:32px;padding:16px;background:var(--sunk);border-radius:14px">

    </section>`:''}
    ${groups.map(g=>`<div style="margin-bottom:24px">
      <h3 style="margin-bottom:10px">${esc(g.e.name)} <span class="hint" style="font-weight:400">${dateF(g.e.date)}</span></h3>
      <div>${g.rows.map(({e,i,a})=>`<div class="err-row ${a.d?'done':''}">
        <input type="checkbox" data-rev="${e.id}:${i}" ${a.d?'checked':''} aria-label="Checked">
        <span style="font-weight:700">${t('q')} ${nf(i+1)}</span>
        <span>${esc(subjectOf(e,i))}</span>
        <span class="st s-${a.s}">${t(a.s==='w'?'wrong':a.s==='c'?'correct':'blank')}</span>
        ${a.s==='w'?`<select data-ersn="${e.id}:${i}"><option value="">${t('r_none')}</option>${REASONS.map(r=>`<option value="${r}" ${a.r===r?'selected':''}>${t('r_'+r)}</option>`).join('')}</select>`:'<span></span>'}
        <span class="star">${a.f?'⚑':''}</span><textarea class="err-comment" data-ecomment="${e.id}:${i}" placeholder="یادداشت یا کامنت برای این سؤال غلط...">${esc(a.comment||'')}</textarea>
      </div>`).join('')}</div>
    </div>`).join('')}
  </div>`;
}

/* settings */
function renderSettings(){
  return`<div class="err-box" style="max-width:760px;margin:0 auto">
    <h1 style="margin-bottom:20px">${t('nav_set')}</h1>
    <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px">
      <div class="field"><label>${t('lang')}</label><select data-s="lang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===S.settings.lang?'selected':''}>${v.label}</option>`).join('')}</select></div>
      <div class="field"><label>${t('default_pen')}</label><select data-s="penalty">${PENS.map(p=>`<option value="${p.v}" ${Math.abs(p.v-S.settings.penalty)<.001?'selected':''}>${t(p.k)}</option>`).join('')}</select></div>
      <div class="field"><label>${t('goal_set')}</label><input data-s="goal" inputmode="numeric" value="${esc(S.settings.goal)}"></div>
    </section>
    <section style="margin-bottom:32px">
      <h2>${t('templates')}</h2><p class="hint" style="margin-bottom:12px">${t('tpl_hint')}</p>
      ${S.templates.length?`<div>${S.templates.map(x=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(x.name)} <small class="hint">(${nf(x.total)} سؤال)</small></span><button class="btn sm danger" data-a="del-tpl" data-id="${x.id}">✕</button></div>`).join('')}</div>`:`<p class="hint">${t('no_tpl')}</p>`}
    </section>
    <section style="margin-bottom:32px">
      <h2>${t('backup')}</h2>
      <div class="row" style="margin:12px 0"><button class="btn" data-a="export">${t('export')}</button><label class="btn ghost">${t('import')}<input type="file" id="file" accept="application/json,.json" hidden></label></div>
      <textarea id="bk" placeholder="${t('paste_ph')}" style="direction:ltr;font-size:.8rem"></textarea>
      <button class="btn sm" data-a="import-paste" style="margin-top:8px">${t('restore_paste')}</button>
    </section>
    <button class="btn danger" data-a="reset">${t('reset')}</button>
  </div>`;
}

function restore(txt){
  try{
    const o=JSON.parse(txt);if(!o||!Array.isArray(o.exams))throw 0;
    S=sanitize(o);persist();view='dash';render();toast(t('imported'));
  }catch(e){toast(t('bad_file'))}
}

/* global events */
document.addEventListener('click',e=>{
  if(e.target.closest('#theme-btn')){
    S.settings.theme=S.settings.theme==='dark'?'light':'dark';
    persist();updateTheme();if(chart){chart.destroy();chart=null;drawChart()}if(examChart){examChart.destroy();examChart=null;drawExamChart()}
    return;
  }
  const nav=e.target.closest('[data-nav]');
  if(nav){
    const v=nav.dataset.nav;if(v==='new'){draft=newDraft();view='edit'}else view=v;
    render();if(view==='edit')setTimeout(()=>{const i=main.querySelector('[data-f=total]');i&&i.focus()},50);
    return;
  }
  if(!main.contains(e.target))return;
  const collapse=e.target.closest('[data-collapse]');
  if(collapse){
    const id=collapse.dataset.collapse;
    if(collapsedPanels.has(id))collapsedPanels.delete(id);else collapsedPanels.add(id);
    const closed=collapsedPanels.has(id),content=$(`#${id}-content`);
    if(content)content.hidden=closed;
    collapse.setAttribute('aria-expanded',String(!closed));
    collapse.title=closed?'بازکردن کادر':'بستن کادر';
    collapse.innerHTML=`<span class="collapse-symbol">${closed?'＋':'−'}</span><span class="collapse-label">${closed?'بازکردن':'بستن'}</span>`;
    const global=main.querySelector('[data-a="toggle-panels"]');if(global)global.textContent=allPanelsCollapsed()?'بازکردن همه کادرها':'بستن همه کادرها';
    if(!closed){requestAnimationFrame(()=>{if(id==='trend'){if(chart)chart.resize();else drawChart()}if(id==='subject'){if(examChart)examChart.resize();else drawExamChart()}})}
    return;
  }
  const q=e.target.closest('.q');
  if(q&&e.target.closest('[data-v]')&&e.target.closest('.seg')){setAnswer(+q.dataset.q,e.target.closest('[data-v]').dataset.v);return}
  const fl=e.target.closest('[data-flag]');if(fl){const i=+fl.dataset.flag;draft.answers[i].f=!draft.answers[i].f;paintCell(i);return}
  const op=e.target.closest('[data-open]');if(op){
    openId=openId===op.dataset.open?null:op.dataset.open;
    const y=window.scrollY;if(chart){chart.destroy();chart=null}if(examChart){examChart.destroy();examChart=null}main.innerHTML=renderDash();drawChart();drawExamChart();window.scrollTo({top:y});return;
  }
  const cs=e.target.closest('[data-csub]');if(cs){
    const s=cs.dataset.csub;chartSubs.has(s)?chartSubs.delete(s):chartSubs.add(s);
    cs.classList.toggle('on');if(chart)chart.destroy();drawChart();return;
  }
  const ef=e.target.closest('[data-ef]');if(ef){errFilter=ef.dataset.ef;main.innerHTML=renderErrors();return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=draft;
  switch(a){
    case'toggle-panels':{const close=!allPanelsCollapsed();DASH_PANELS.forEach(id=>close?collapsedPanels.add(id):collapsedPanels.delete(id));const y=window.scrollY;if(chart){chart.destroy();chart=null}if(examChart){examChart.destroy();examChart=null}main.innerHTML=renderDash();drawChart();drawExamChart();window.scrollTo({top:y});break;}
    case'counterfactual':counterfactualOpen.has(b.dataset.id)?counterfactualOpen.delete(b.dataset.id):counterfactualOpen.add(b.dataset.id);{const y=window.scrollY;if(chart){chart.destroy();chart=null}if(examChart){examChart.destroy();examChart=null}main.innerHTML=renderDash();drawChart();drawExamChart();window.scrollTo({top:y});}break;
    case'mode':switchMode(b.dataset.v);break;
    case'add-sub':d.subjects.push({name:'',count:'',c:'',w:'',coef:1});$('#entry').innerHTML=renderEntry();main.querySelector(`[data-sub="${d.subjects.length-1}"][data-k=name]`).focus();break;
    case'rm-sub':d.subjects.splice(+b.dataset.i,1);$('#entry').innerHTML=renderEntry();updateLive();break;
    case'add-range':{const last=d.ranges[d.ranges.length-1],from=(int(last&&last.to)||0)+1;d.ranges.push({name:'',from,to:int(d.total)||''});$('#entry').innerHTML=renderEntry();main.querySelector(`[data-rng="${d.ranges.length-1}"][data-k=name]`).focus();updateLive();break}
    case'rm-rng':d.ranges.splice(+b.dataset.i,1);$('#entry').innerHTML=renderEntry();updateLive();break;
    case'fill':for(let i=+b.dataset.from;i<=+b.dataset.to;i++){d.answers[i].s=b.dataset.v;delete d.answers[i].r;paintCell(i)}updateLive();break;
    case'quick':{let i=Math.max(1,int($('#qfrom').value))-1;const n=int(d.total);const s=toEn($('#qtext').value);for(const ch of s){if(i>=n)break;const v=/[1cCدd✓]/.test(ch)?'c':/[2wWغx✕]/.test(ch)?'w':/[0bBن\-–._]/.test(ch)?'b':null;if(!v)continue;d.answers[i].s=v;if(v!=='w')delete d.answers[i].r;paintCell(i);i++}$('#qfrom').value=Math.min(n,i+1);$('#qtext').value='';updateLive();break}
    case'save':saveDraft();break;
    case'cancel':draft=null;view='dash';render();break;
    case'edit':{const ex=S.exams.find(x=>x.id===b.dataset.id);if(ex){draft=draftFrom(ex);view='edit';render()}break}
    case'del':if(b.classList.contains('armed')){S.exams=S.exams.filter(x=>x.id!==b.dataset.id);persist();openId=null;render();toast(t('deleted'))}else{b.classList.add('armed');b.textContent=t('sure');setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=t('del')}},3000)}break;
    case'save-tpl':{const items=tplItems();if(!items.length)return toast(t('need_total'));const total=items.reduce((s,x)=>s+x.count,0);const nm=($('#tplname').value||'').trim()||`${t('untitled')} ${nf(total)}`;S.templates.push({id:uid(),name:nm,total,items});persist();main.innerHTML=renderEditor();updateLive();toast(t('saved'));break}
    case'del-tpl':S.templates=S.templates.filter(x=>x.id!==b.dataset.id);persist();render();break;
    case'export':{const txt=JSON.stringify(S,null,2);$('#bk').value=txt;try{const bl=new Blob([txt],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download=`karnameh-${today()}.json`;document.body.appendChild(l);l.click();l.remove()}catch(err){}break}
    case'import-paste':restore($('#bk').value);break;
    case'reset':if(b.classList.contains('armed')){S=sanitize({settings:S.settings});persist();view='dash';render();toast(t('deleted'))}else{b.classList.add('armed');b.textContent=t('sure');setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=t('reset')}},3000)}break;
  }
});

main.addEventListener('input',e=>{
  const el=e.target,d=draft;
  if(el.dataset.f&&d){const f=el.dataset.f;if(f==='total')return setTotal(el.value);d[f]=f==='penalty'?+el.value:el.value;if(f==='penalty')updateLive();return}
  if(el.dataset.sub!=null){const i=+el.dataset.sub,k=el.dataset.k,s=d.subjects[i];s[k]=el.value;
    if(k==='count'&&d.subjects.length===1){d.total=el.value;const ti=main.querySelector('[data-f=total]');if(ti)ti.value=el.value}
    const n=int(s.count),c=int(s.c),w=int(s.w);const o=$('#sb-'+i);if(o)o.textContent=nf(Math.max(0,n-c-w));$('#sr-'+i).classList.toggle('bad',c+w>n);$('#summsg').textContent=sumMsg();updateLive();return}
  if(el.dataset.rng!=null){d.ranges[+el.dataset.rng][el.dataset.k]=el.value;$('#grid').innerHTML=renderGrid();updateLive();return}
  if(el.dataset.ecomment){const[id,i]=el.dataset.ecomment.split(':');const ex=S.exams.find(x=>x.id===id);if(ex&&ex.answers[i]){ex.answers[i].comment=el.value;persist()}return}
  if(el.dataset.enote){const ex=S.exams.find(x=>x.id===el.dataset.enote);if(ex){ex.note=el.value;clearTimeout(noteTimer);noteTimer=setTimeout(()=>{persist();toast(t('notes_saved'))},600)}return}
  if(el.dataset.s==='goal'){S.settings.goal=Math.max(0,Math.min(100,int(el.value)));persist();return}
});

main.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.rsn!=null){draft.answers[+el.dataset.rsn].r=el.value||undefined;return}
  if(el.dataset.ersn){const[id,i]=el.dataset.ersn.split(':');const ex=S.exams.find(x=>x.id===id);if(ex){ex.answers[+i].r=el.value||undefined;persist();main.innerHTML=renderErrors()}return}
  if(el.dataset.rev){const[id,i]=el.dataset.rev.split(':');const ex=S.exams.find(x=>x.id===id);if(ex){const a=ex.answers[+i];a.d=el.checked?1:undefined;persist();el.closest('.err-row').classList.toggle('done',el.checked);if(errFilter==='open')setTimeout(()=>{main.innerHTML=renderErrors()},300)}return}
  if(el.id==='exam-chart-select'){if(examChart){examChart.destroy();examChart=null}drawExamChart();return}
  if(el.hasAttribute('data-tpl')){applyTpl(el.value);return}
  if(el.dataset.s==='lang'){S.settings.lang=el.value;persist();render();return}
  if(el.dataset.s==='penalty'){S.settings.penalty=+el.value;persist();return}
  if(el.id==='file'&&el.files[0]){const fr=new FileReader();fr.onload=()=>restore(fr.result);fr.readAsText(el.files[0])}
});

main.addEventListener('keydown',e=>{
  const q=e.target.classList&&e.target.classList.contains('q')?e.target:null;if(!q)return;
  const i=+q.dataset.q,k=toEn(e.key).toLowerCase(),rtl=L().dir==='rtl';
  const map={'1':'c','c':'c','2':'w','w':'w','0':'b','b':'b',' ':'b','-':'b'};
  const go=j=>{const n=main.querySelector(`.q[data-q="${j}"]`);if(n){n.focus();n.scrollIntoView({block:'nearest'})}};
  if(map[k]){e.preventDefault();setAnswer(i,map[k]);go(i+1);return}
  if(k==='f'||k==='3'){e.preventDefault();draft.answers[i].f=!draft.answers[i].f;paintCell(i);return}
  if(e.key==='ArrowRight'){e.preventDefault();go(rtl?i-1:i+1)}
  if(e.key==='ArrowLeft'){e.preventDefault();go(rtl?i+1:i-1)}
  if(e.key==='Backspace'){e.preventDefault();setAnswer(i,'b');go(i-1)}
});

$('#lang').addEventListener('change',e=>{S.settings.lang=e.target.value;persist();render()});

render();
</script>

<div id="pwa-install" role="region" aria-label="نصب کارنامه Pro">
  <span style="flex:1">کارنامه Pro را روی گوشی نصب کن</span>
  <button id="pwa-install-btn" type="button">نصب</button>
  <button class="pwa-dismiss" id="pwa-install-dismiss" type="button" aria-label="بستن">×</button>
</div>
<script>
(()=>{
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA service worker:', err)));
  }
  let installPrompt=null;
  const banner=document.getElementById('pwa-install');
  const installBtn=document.getElementById('pwa-install-btn');
  const dismissBtn=document.getElementById('pwa-install-dismiss');
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault(); installPrompt=event;
    if (!sessionStorage.getItem('pwa-install-dismissed') && banner) banner.style.display='flex';
  });
  installBtn?.addEventListener('click', async()=>{
    if(!installPrompt)return; installPrompt.prompt();
    try{await installPrompt.userChoice;}catch(e){}
    installPrompt=null; if(banner)banner.style.display='none';
  });
  dismissBtn?.addEventListener('click',()=>{if(banner)banner.style.display='none';sessionStorage.setItem('pwa-install-dismissed','1')});
  window.addEventListener('appinstalled',()=>{if(banner)banner.style.display='none';installPrompt=null});
})();
</script>
